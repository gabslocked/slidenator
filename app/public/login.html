<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slidenator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public/styles.css">
</head>
<body class="auth-body">
<div class="auth-wrap">
  <p class="auth-logo">Slidenator</p>
  <div class="auth-card">
    <div class="auth-tabs">
      <button type="button" id="tabLogin" class="auth-tab active">Entrar</button>
      <button type="button" id="tabRegister" class="auth-tab">Criar conta</button>
    </div>

    <form id="loginForm" class="auth-form">
      <label>E-mail<input id="loginEmail" type="email" required autocomplete="email"></label>
      <label>Senha<input id="loginPassword" type="password" required autocomplete="current-password"></label>
      <p id="loginError" class="auth-error" hidden></p>
      <button type="submit" class="btn-dark">Entrar</button>
    </form>

    <form id="registerForm" class="auth-form" hidden>
      <label>Nome<input id="registerName" type="text" required autocomplete="name"></label>
      <label>E-mail<input id="registerEmail" type="email" required autocomplete="email"></label>
      <label>Senha (mín. 8 caracteres)<input id="registerPassword" type="password" required minlength="8" autocomplete="new-password"></label>
      <p id="registerError" class="auth-error" hidden></p>
      <button type="submit" class="btn-dark">Criar conta</button>
    </form>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function showTab(which) {
  const isLogin = which === 'login';
  $('tabLogin').classList.toggle('active', isLogin);
  $('tabRegister').classList.toggle('active', !isLogin);
  $('loginForm').hidden = !isLogin;
  $('registerForm').hidden = isLogin;
}
$('tabLogin').onclick = () => showTab('login');
$('tabRegister').onclick = () => showTab('register');

async function submitAuth(path, body, errEl) {
  errEl.hidden = true;
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 200) {
      location.href = '/';
      return;
    }
    errEl.textContent = data.error || 'Não foi possível concluir. Tente novamente.';
    errEl.hidden = false;
  } catch (e) {
    errEl.textContent = 'Falha de conexão. Tente novamente.';
    errEl.hidden = false;
  }
}

$('loginForm').onsubmit = (ev) => {
  ev.preventDefault();
  submitAuth('/api/auth/login', {
    email: $('loginEmail').value.trim(),
    password: $('loginPassword').value,
  }, $('loginError'));
};

$('registerForm').onsubmit = (ev) => {
  ev.preventDefault();
  submitAuth('/api/auth/register', {
    name: $('registerName').value.trim(),
    email: $('registerEmail').value.trim(),
    password: $('registerPassword').value,
  }, $('registerError'));
};
</script>
</body>
</html>
