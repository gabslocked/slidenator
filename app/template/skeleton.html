  colors: /*THEME*/{ ink:'#070808', card:'#15181A', card2:'#1B1F21', edge:'#2B2F31', lime:'#D8E022', lime2:'#9EC100', olive:'#7E9C00', limetint:'#F4F8D6', paper:'#EBEBEB', mut:'#9BA1A4', mutl:'#5C6265' }/*THEME*/,
  fontFamily: { sora:['Sora','ui-sans-serif','system-ui','sans-serif'] },

<style>
  :root { --ease: cubic-bezier(.22,1,.36,1); }
  html, body { height:100%; margin:0; background:#020303; overflow:hidden; font-family:'Sora',sans-serif; }

  #stage { position:absolute; top:50%; left:50%; width:1280px; height:720px; transform-origin:center; background:#070808; overflow:hidden; }

  .slide { position:absolute; inset:0; opacity:0; overflow:hidden; pointer-events:none; transition:opacity .45s var(--ease); }
  .slide.active { opacity:1; pointer-events:auto; }

  /* Reveal da casa: 28px, .7s, curva assinatura, cascata via data-d */
  .rv { opacity:0; transform:translateY(28px); transition:opacity .7s var(--ease), transform .7s var(--ease); }
  .in .rv, .rv.in { opacity:1; transform:translateY(0); }

  .icon { display:inline-block; background-size:contain; background-repeat:no-repeat; background-position:center; }

  .caret { display:inline-block; width:2px; height:1.05em; background:#D8E022; vertical-align:text-bottom; animation:blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .tdot { width:5px; height:5px; border-radius:9999px; background:#9BA1A4; display:inline-block; animation:dp 1.2s infinite var(--ease); }
  .tdot:nth-child(2){animation-delay:.15s} .tdot:nth-child(3){animation-delay:.3s}
  @keyframes dp { 0%,60%,100%{transform:translateY(0);opacity:.4} 30%{transform:translateY(-3px);opacity:1} }

  .animate-float { animation:float 5.5s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }

  .spin { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .dashflow { animation: dashmove 1.1s linear infinite; }
  @keyframes dashmove { to { stroke-dashoffset: -16; } }
  .ledblink { animation: led 1.6s ease-in-out infinite; }
  @keyframes led { 0%,100% { opacity:.2 } 50% { opacity:1 } }
  .pulsering { animation: pring 2.4s var(--ease) infinite; }
  @keyframes pring { 0% { box-shadow:0 0 0 0 rgba(158,193,0,.4) } 70% { box-shadow:0 0 0 16px rgba(158,193,0,0) } 100% { box-shadow:0 0 0 0 rgba(158,193,0,0) } }

  .pod { transition:opacity .5s var(--ease), transform .5s var(--ease); }
  .pod.pop { animation:pop .55s var(--ease); }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.12)} 100%{transform:scale(1)} }
  .pod.gone { opacity:0; transform:scale(.4); }

  .shake { animation:shake .5s var(--ease); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 50%{transform:translateX(5px)} 75%{transform:translateX(-3px)} }

  .flowdot { position:absolute; width:10px; height:10px; border-radius:9999px; }

  .btn { cursor:pointer; user-select:none; transition:transform .2s var(--ease), filter .2s var(--ease); }
  .btn:hover { filter:brightness(1.08); } .btn:active { transform:scale(.96); }

  .bar-fill { transition:width .35s var(--ease), background-color .35s var(--ease); }
  .feed-move { transition:transform .55s var(--ease); }
  .fade { transition:opacity .3s var(--ease); }

  #nav-group { opacity:.14; transition:opacity .35s var(--ease); }
  #nav-group:hover, #nav-group:focus-within { opacity:1; }

  .hb { animation:hb 1.6s ease-in-out infinite; }
  @keyframes hb { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.45);opacity:.55} }
  .ghspin { border:2px solid #30363D; border-top-color:#D29922; border-radius:9999px; animation:spin 1s linear infinite; }
  .reqchip { transition:opacity .45s var(--ease), transform .45s var(--ease); }
  .reqchip.out { opacity:0; transform:translateX(26px); }

  @media (prefers-reduced-motion: reduce) {
    .rv{opacity:1!important;transform:none!important;transition:none!important}
    .animate-float,.caret,.tdot,.spin{animation:none!important}
  }
</style>
<style id="deck-theme">/*THEME_CSS*/</style>
</head>

<div id="chrome-logo" class="absolute right-14 top-11 z-40 pointer-events-none">
  <span id="brand-w" class="hidden text-white font-extrabold tracking-[.22em] text-[13px]">{{BRAND}}</span>
  <span id="brand-d" class="hidden text-ink font-extrabold tracking-[.22em] text-[13px]">{{BRAND}}</span>
</div>
<div id="nav-group" class="absolute bottom-8 right-14 z-40 flex items-center gap-3">

  <span id="page-ind" class="text-[12px] font-bold tracking-widest"></span>
  <button id="nav-next" class="btn w-9 h-9 rounded-full border flex items-center justify-center" aria-label="próximo"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M9 5l7 7-7 7"/></svg></button>
</div>

(function () {
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const stage = document.getElementById('stage');
  const slides = Array.from(document.querySelectorAll('.slide'));
  const pageInd = document.getElementById('page-ind');
  const brandW = document.getElementById('brand-w'), brandD = document.getElementById('brand-d');
  const navPrev = document.getElementById('nav-prev'), navNext = document.getElementById('nav-next');

  /* ---------- palco 16:9 escalado ---------- */
  function fit() {
    const s = Math.min(innerWidth / 1280, innerHeight / 720);
    stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  addEventListener('resize', fit); fit();

  /* ---------- Reveal por slide: cascata via data-d, uma vez ---------- */
  function reveal(slide) {
    slide.querySelectorAll('.rv').forEach(el => {
      const d = parseInt(el.dataset.d || '0', 10);
      el.style.transitionDelay = (reduced ? 0 : d) + 'ms';
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    });
  }

  /* ---------- CountUp: ease-out cúbico, pt-BR ---------- */
  function countUp(el) {
    const target = parseFloat(el.dataset.target || '0');
    const prefix = el.dataset.prefix || '', suffix = el.dataset.suffix || '';
    const dec = parseInt(el.dataset.decimals || '0', 10);
    const fmt = v => prefix + v.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suffix;
    if (reduced) { el.textContent = fmt(target); return; }
    const t0 = performance.now(), dur = 1200;
    (function f(now) {
      const t = Math.min((now - t0) / dur, 1), e = 1 - Math.pow(1 - t, 3);
      el.textContent = fmt(target * e);
      if (t < 1) requestAnimationFrame(f); else el.textContent = fmt(target);
    })(t0);
  }

  /* ================= demos por slide ================= */
  const demos = {};
  const timers = [];
  function every(ms, fn) { const id = setInterval(fn, ms); timers.push(id); return id; }
  function later(ms, fn) { const id = setTimeout(fn, ms); timers.push(id); return id; }
  function clearTimers() { timers.splice(0).forEach(id => { clearInterval(id); clearTimeout(id); }); }

  function hydrateIcons(root) {
    (root || document).querySelectorAll('[data-icon]').forEach(el => {
      const src = ICONS[el.dataset.icon];
      if (src) el.style.backgroundImage = 'url("' + src + '")';
    });
  }
  hydrateIcons();

  /* ---------- navegação ---------- */
  let cur = -1;
  const played = new Set();
  function setChrome(theme) {
    const dark = theme === 'dark';
    brandW.classList.toggle('hidden', !dark);
    brandD.classList.toggle('hidden', dark);
    pageInd.className = 'text-[12px] font-bold tracking-widest ' + (dark ? 'text-mut' : 'text-mutl');
    [navPrev, navNext].forEach(b => {
      b.className = 'btn w-9 h-9 rounded-full border flex items-center justify-center ' + (dark ? 'border-edge text-white bg-card' : 'border-neutral-300 text-ink bg-white');
    });
  }
  function go(n) {
    if (n < 0 || n >= slides.length || n === cur) return;
    if (cur >= 0) { slides[cur].classList.remove('active'); Object.values(demos).forEach(d => d.on = false); clearTimers(); }
    cur = n;
    const slide = slides[cur];
    slide.classList.add('active');
    setChrome(slide.dataset.theme);
    pageInd.textContent = '(' + String(cur + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0') + ')';
    if (!played.has(cur)) { played.add(cur); reveal(slide); }
    slide.querySelectorAll('[data-countup]').forEach(countUp);
    const demo = demos[slide.dataset.demo];
    if (demo) { demo.on = true; try { demo.start(); } catch (e) { console.error('demo', slide.dataset.demo, e); } }
    const inp = slide.querySelector('input[data-autofocus]');
    if (inp) setTimeout(() => { if (slide.classList.contains('active')) inp.focus(); }, 450);
    location.hash = 'slide-' + (cur + 1);
  }
  navNext.onclick = () => go(cur + 1);
  navPrev.onclick = () => go(cur - 1);
  addEventListener('keydown', e => {
    const t = e.target;
    let typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable);
    if (typing && !t.closest('.slide.active')) { t.blur(); typing = false; }
    if (typing) { if (e.key === 'Escape') t.blur(); if (!['PageDown', 'PageUp', 'Home', 'End'].includes(e.key)) return; }
    if (['ArrowRight', 'PageDown', ' '].includes(e.key)) { e.preventDefault(); go(cur + 1); }
    if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    if (e.key === 'Home') go(0);
    if (e.key === 'End') go(slides.length - 1);
  });
  const fromHash = parseInt((location.hash.match(/slide-(\d+)/) || [])[1] || '1', 10) - 1;
  go(Math.min(Math.max(fromHash, 0), slides.length - 1));
})();
</script>
</body>
</html>
